<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vrExperienceStudio</title>

    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        var fullPath = path + search + hash;

        sessionStorage.setItem('redirectPath', fullPath);

        window.location.replace('/');
      })();
    </script>
  </head>

  <body>
    <div style="
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05010d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    ">
      <div>
        <h1 style="margin-bottom: 12px;">Loading experience...</h1>
        <p style="opacity: 0.75;">Redirecting to vrExperienceStudio.</p>
      </div>
    </div>
  </body>
</html>
